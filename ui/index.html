<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; style-src 'self'; script-src 'self'">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div id="strip">
    <div id="tabs"></div>
    <button id="new" class="icon" title="New tab (⌘T)">
      <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>
    </button>
  </div>
  <div id="bar">
    <button id="back" class="icon" title="Back">
      <svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg>
    </button>
    <button id="forward" class="icon" title="Forward">
      <svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg>
    </button>
    <button id="reload" class="icon" title="Reload">
      <svg class="r" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.55M13 2.5V5h-2.5"/></svg>
      <svg class="x" viewBox="0 0 16 16"><path d="m4 4 8 8M12 4l-8 8"/></svg>
    </button>
    <form id="form">
      <span id="lock"><svg viewBox="0 0 16 16"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg></span>
      <input id="address" spellcheck="false" autocomplete="off" placeholder="Search Google or type a URL">
    </form>
  </div>
</header>
<script src="chrome.js"></script>
</body>
</html>
